<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickies</title>
<link rel="stylesheet" href="coquette-design-system.css">
<link rel="stylesheet" href="stickies.css">
</head>
<body>

<div class="stickies-widget">
  <div class="stickies-header">
    <p class="stickies-title">Stickies ♡</p>
    <button class="btn" onclick="addSticky()">+ New note</button>
  </div>
  <div class="stickies-grid" id="stickiesGrid"></div>
</div>

<script>
  function addSticky(text) {
    const grid = document.getElementById('stickiesGrid');

    const note = document.createElement('div');
    note.className = 'sticky-note';

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'sticky-note-delete';
    deleteBtn.innerHTML = '&times;';
    deleteBtn.onclick = () => note.remove();

    const textarea = document.createElement('textarea');
    textarea.className = 'sticky-note-text';
    textarea.placeholder = 'Write a sticky...';
    if (text) textarea.value = text;

    note.appendChild(deleteBtn);
    note.appendChild(textarea);
    grid.appendChild(note);
    textarea.focus();
  }

  // starter note
  addSticky();
</script>

</body>
</html>
